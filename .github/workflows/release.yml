name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches script version
        run: |
          script_version="$(bash dns-warden.sh --version)"
          if [ "v${script_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match script version v${script_version}" >&2
            exit 1
          fi
      - name: Run checks
        run: |
          bash -n dns-warden.sh
          shellcheck -S warning dns-warden.sh tests/*.sh
          bash tests/test-dnssec-classification.sh
          bash tests/test-apply-target.sh
      - name: Build release assets
        run: |
          tar -czf "dns-warden-${GITHUB_REF_NAME}.tar.gz" \
            dns-warden.sh dns-list.txt LICENSE README.md README.fa.md
          sha256sum dns-warden.sh dns-list.txt "dns-warden-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: |
            dns-warden.sh
            dns-list.txt
            dns-warden-${{ github.ref_name }}.tar.gz
            SHA256SUMS
